<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MANIFEST BAR — HLS Extractor</title>
<meta name="theme-color" content="#F5F0E6" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' fill='%23FFD93D' stroke='%23101010' stroke-width='4'/%3E%3Cpath d='M16 2h14v14H16zM2 16h14v14H2z' fill='%23101010'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
<div class="bar-wrapper">
  <span class="sticker sticker-a">HLS EXTRACTOR</span>
  <span class="sticker sticker-b">AEBN · ADE · EA</span>

  <div class="command-bar" id="commandBar">
    <header class="brand-row">
      <a class="brand" href="#" aria-label="Manifest Bar home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" focusable="false">
            <rect x="2" y="2" width="28" height="28" fill="#FFD93D" stroke="#101010" stroke-width="4" />
            <path d="M16 2h14v14H16zM2 16h14v14H2z" fill="#101010" />
          </svg>
        </span>
        <span class="brand-text">MANIFEST<span>BAR</span></span>
      </a>
      <nav class="top-nav" aria-label="Pages">
        <a class="nav-link active" href="#">EXTRACT</a>
        <a class="nav-link" href="#/cookies">COOKIES</a>
      </nav>
    </header>

    <div class="input-row">
      <div class="input-wrap">
        <input type="text" class="input-field" id="urlInput"
          placeholder="PASTE AEBN / ADE / ELEGANT ANGEL LINK…"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus />
      </div>
      <button class="go-btn" id="goBtn" title="Fetch (Enter)" type="button">GO <span aria-hidden="true">↗</span></button>
    </div>

    <div class="mode-row" id="modeRow">
      <button class="mode-pill active" data-mode="manifest">Manifest</button>
      <button class="mode-pill" data-mode="info">Info</button>
      <button class="mode-pill" data-mode="covers">Covers</button>
      <button class="mode-pill" data-mode="screenshots">Screenshots</button>
      <span class="mode-hint" id="srcHint"></span>
    </div>

    <div class="body" id="resultBody"></div>
    <div class="body" id="cookiesPage"></div>

    <div class="body" id="histBody">
      <div class="hist-header">
        <span class="hist-title">Recent links</span>
        <button class="hist-clear" id="clearHist" type="button">Clear</button>
      </div>
      <div class="hist-list" id="histList"></div>
    </div>

    <div class="body" id="loginBody">
      <div class="section-label">Locked</div>
      <div class="login-wrap">
        <input type="password" class="login-input" id="loginPass" placeholder="PASSWORD…  (↵ UNLOCK)" />
        <button class="btn primary" id="loginBtn" type="button">Unlock</button>
      </div>
    </div>
  </div>

  <p class="bar-footnote">Paste anywhere · ↑↓ select · ←→ switch tabs · ↵ copy</p>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"><polyline points="20 6 9 17 4 12" /></svg>
  <span id="toastText">Copied</span>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
