services:
  - type: web
    name: aebn-web
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ADE_COOKIES_URL
        sync: false
      - key: THPASTE_API_KEY
        sync: false
      - key: THPASTE_ADE_ID
        sync: false
      - key: THPASTE_EA_ID
        sync: false
      - key: THPASTE_DVD_ID
        sync: false
      - key: WEB_PASSWORD
        sync: false
