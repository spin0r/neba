services:
  - type: web
    name: aebn-bot
    runtime: docker
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: ADE_COOKIES_URL
        sync: false
      - key: THPASTE_API_KEY
        sync: false
      - key: THPASTE_ADE_ID
        sync: false
      - key: THPASTE_EA_ID
        sync: false
      - key: THPASTE_DVD_ID
        sync: false
      - key: WEB_PASSWORD
        sync: false
